[project]
name = "herepy"
version = "3.6.5"
description = "A library that provides a Python interface to the HERE APIs"
readme = "README.rst"
requires-python = ">=3.8"
license = {text = "MIT License"}
authors = [
    {name = "Abdullah Selek", email = "abdullahselek.os@gmail.com"}
]
keywords = ["here api", "here technologies", "here python api clients", "rest api clients"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Requests>=2.25.1,<3",
]

[project.urls]
Repository = "https://github.com/abdullahselek/HerePy"
Download = "https://pypi.org/pypi/herepy"
Documentation = "https://herepy.abdullahselek.com/"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-runner==6.0.1",
    "codecov==2.1.13",
    "responses==0.25.0",
    "tox==4.14.2",
    "tox-pyenv==1.1.0",
    "flake8",
]
docs = [
    "mkdocs==1.6.1; python_version >= '3.9'",
    "mkdocstrings==0.26.2; python_version >= '3.9'",
    "mkdocs-material==9.5.42; python_version >= '3.9'",
    "markdown-include==0.8.1; python_version >= '3.9'",
    "mkdocstrings-python==1.12.2; python_version >= '3.9'",
    "livereload; python_version >= '3.9'",
]

[tool.setuptools]
packages = {find = {exclude = ["tests*", "docs*"]}}
package-data = {herepy = ["py.typed"]}
