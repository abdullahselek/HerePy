[project]
name = "herepy"
version = "3.6.5"
description = "A library that provides a Python interface to the HERE APIs"
readme = "README.rst"
requires-python = ">=3.10"
license = { text = "MIT License" }
authors = [{ name = "Abdullah Selek", email = "abdullahselek.os@gmail.com" }]
keywords = [
  "here api",
  "here technologies",
  "here python api clients",
  "rest api clients",
]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["Requests>=2.25.1,<3"]

[project.urls]
Repository = "https://github.com/abdullahselek/HerePy"
Download = "https://pypi.org/pypi/herepy"
Documentation = "https://herepy.abdullahselek.com/"

[dependency-groups]
dev = [
  "pytest==8.1.1",
  "pytest-cov==5.0.0",
  "pytest-runner==6.0.1",
  "codecov==2.1.13",
  "responses==0.25.0",
  "tox==4.14.2",
  "tox-pyenv==1.1.0",
  "flake8",
  "nox>=2026.4.10",
  "ruff>=0.15.16",
  "mypy>=2.1.0",
]
docs = [
  "mkdocs==1.6.1",
  "mkdocstrings==0.26.2",
  "mkdocs-material==9.5.42",
  "markdown-include==0.8.1",
  "mkdocstrings-python==1.12.2",
  "livereload",
]

[tool.setuptools]
packages = { find = { exclude = ["tests*", "docs*"] } }
package-data = { herepy = ["py.typed"] }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
src = ["src"]
target-version = "py310"
line-length = 140

[tool.ruff.lint]
select = [
  "D",  # pydocstyle
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
  "W",  # pycodestyle warnings
]
ignore = [
    "D203", # 1 blank line required before class docstring (incompatible with D211)
    "D212", # Multi-line summary should start on the same line as the opening quotes (incompatible with D213)
    "D107", # Constructor documentation is covered by the class docstring.
]

[tool.ruff.lint.per-file-ignores]
# Ignore all directories named `tests`.
"tests/**" = ["D", "E", "F"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
